services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: peertube
      POSTGRES_DB: peertube_dev
    ports:
      - "5432:5432"
    volumes:
      - peertube-development-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube -d peertube_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6381:6379"
    volumes:
      - peertube-development-redis:/data

volumes:
  peertube-development-postgres:
  peertube-development-redis:
