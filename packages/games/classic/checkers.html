<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="国际跳棋人机对战：斜向移动，跳过对方棋子吃子，抵达底线即可升王。">
<meta name="gamehub-instructions" content="先点击自己的红棋，再点击高亮的合法目标格。若有可吃的棋必须优先吃子。">
<meta name="gamehub-keywords" content="国际跳棋,checkers,棋类,策略,经典">
<title>国际跳棋 · Checkers</title>
<style>
  :root{--bg:#17131a;--dark:#67434e;--light:#e7d1b6;--red:#ff5e78;--blue:#62a8ff;--text:#fff6f7;--muted:#c5aeb5}*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,'Microsoft YaHei',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}.hud{display:flex;gap:22px;font-weight:800}.redtxt{color:var(--red)}.bluetxt{color:var(--blue)}.board{display:grid;grid-template-columns:repeat(8,minmax(35px,58px));border:6px solid #3f2730;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px #0008}.cell{aspect-ratio:1;border:0;background:var(--light);position:relative}.cell.dark{background:var(--dark);cursor:pointer}.cell.target::after{content:'';position:absolute;inset:37%;border:3px solid #fff7;border-radius:50%}.piece{position:absolute;inset:12%;border-radius:50%;box-shadow:inset 0 4px 6px #fff5,0 3px 4px #0009}.p1{background:radial-gradient(circle at 35% 28%,#ffbdc8,var(--red) 58%,#a62640)}.p2{background:radial-gradient(circle at 35% 28%,#bcd8ff,var(--blue) 58%,#285aab)}.king::after{content:'♛';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:clamp(15px,4vw,27px);text-shadow:0 2px 2px #000}.hint{font-size:.84rem;color:var(--muted)}.btn{border:0;border-radius:9px;background:var(--red);color:white;padding:12px 28px;font:700 1rem inherit;cursor:pointer}.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:24px;background:#0d090eee;text-align:center}.overlay h1 span{color:var(--red)}.overlay p{max-width:340px;line-height:1.6;color:var(--muted)}.fs{position:fixed;top:12px;right:12px;z-index:7;width:40px;height:40px;border-radius:8px;border:1px solid #ffffff33;background:#3d2830cc;color:white;cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<button class="fs" id="fsBtn" aria-label="全屏">⛶</button><div class="hud"><span class="redtxt">● 你 <b id="you">12</b></span><span class="bluetxt">● 电脑 <b id="ai">12</b></span></div><div class="board" id="board" aria-label="国际跳棋棋盘"></div><p class="hint" id="hint">你执红棋，向上移动</p>
<div class="overlay" id="start"><h1>国际 <span>跳棋</span></h1><p>斜向移动，跳过相邻敌子可吃子。到达对面底线会升为王，王可前后移动。</p><button class="btn" id="startBtn">开始对局</button></div><div class="overlay" id="over" style="display:none"><h1 id="result"></h1><p id="summary"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),boardEl=$('board');let b,turn,sel,locked,ended;const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;function reset(){b=Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>(r+c)%2? r<3?{p:2,k:false}:r>4?{p:1,k:false}:null:null));turn=1;sel=null;locked=false;ended=false;$('start').style.display='none';$('over').style.display='none';render()}
function dirs(piece){return piece.k?[-1,1]:piece.p===1?[-1]:[1]}function movesFor(r,c,forceCapture=false){const q=b[r][c];if(!q)return[];let out=[];for(const dr of dirs(q))for(const dc of[-1,1]){const R=r+dr,C=c+dc;if(inb(R,C)&&!b[R][C]&&!forceCapture)out.push({to:[R,C]});const J=r+2*dr,K=c+2*dc;if(inb(J,K)&&b[R]?.[C]&&b[R][C].p!==q.p&&!b[J][K])out.push({to:[J,K],cap:[R,C]})}return out}function allMoves(p){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.p===p)a.push(...movesFor(r,c).map(m=>({...m,from:[r,c]})));const caps=a.filter(m=>m.cap);return caps.length?caps:a}function promote(r,c){if((b[r][c].p===1&&r===0)||(b[r][c].p===2&&r===7))b[r][c].k=true}function apply(m){const q=b[m.from[0]][m.from[1]];b[m.to[0]][m.to[1]]=q;b[m.from[0]][m.from[1]]=null;if(m.cap)b[m.cap[0]][m.cap[1]]=null;promote(...m.to)}function count(p){return b.flat().filter(q=>q?.p===p).length}function render(){const valid=sel?movesFor(...sel,allMoves(turn).some(m=>m.cap)):[];boardEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const e=document.createElement('button');e.className='cell '+((r+c)%2?'dark':'');e.dataset.r=r;e.dataset.c=c;if(valid.some(m=>m.to[0]===r&&m.to[1]===c))e.classList.add('target');const q=b[r][c];if(q){const p=document.createElement('i');p.className='piece p'+q.p+(q.k?' king':'');e.append(p)}boardEl.append(e)}$('you').textContent=count(1);$('ai').textContent=count(2);$('hint').textContent=ended?'对局结束':turn===1?'选择红棋并移动':'电脑正在思考…'}
function finish(){ended=true;const a=count(1),z=count(2);$('result').textContent=a>z?'你赢了！':'电脑获胜';$('summary').textContent=`剩余棋子：你 ${a} 枚 · 电脑 ${z} 枚`;$('over').style.display='flex';render()}function checkEnd(){if(!count(1)||!count(2)||!allMoves(turn).length){finish();return true}return false}function ai(){const options=allMoves(2);if(!options.length)return finish();options.sort((a,z)=>(z.cap?20:0)+(z.to[0]*2)-(a.cap?20:0)-(a.to[0]*2));apply(options[0]);turn=1;locked=false;if(!checkEnd())render()}
boardEl.onclick=e=>{const cell=e.target.closest('.cell');if(!cell||turn!==1||locked||ended)return;const r=+cell.dataset.r,c=+cell.dataset.c;const legal=sel?movesFor(...sel,allMoves(1).some(m=>m.cap)):[];const m=legal.find(n=>n.to[0]===r&&n.to[1]===c);if(m){apply({...m,from:sel});sel=null;turn=2;if(checkEnd())return;locked=true;render();setTimeout(ai,400);return}if(b[r][c]?.p===1&&movesFor(r,c,allMoves(1).some(m=>m.cap)).length)sel=[r,c];else sel=null;render()};$('startBtn').onclick=reset;$('retryBtn').onclick=reset;$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶')})()
</script>
</body>
</html>
