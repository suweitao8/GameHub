<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="猜单词：根据中文提示猜出英文单词，六次错误前找全所有字母。">
<meta name="gamehub-instructions" content="点击字母键盘或使用实体键盘猜字母。每猜错一次，绞刑架会增加一笔。">
<meta name="gamehub-keywords" content="猜单词,hangman,单词,益智,经典">
<title>猜单词 · Hangman</title>
<style>
  :root{--bg:#171522;--panel:#27243a;--brand:#8d7aff;--bad:#ff668b;--text:#f5f2ff;--muted:#bbb3d2}*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 25%,#383254,#171522 70%);color:var(--text);font-family:Segoe UI,Arial,'Microsoft YaHei',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:12px}.stage{display:grid;place-items:center;width:min(93vw,470px);height:230px;background:#211f31;border-radius:14px;box-shadow:0 12px 32px #0009}.word{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.letter{width:33px;border-bottom:3px solid var(--brand);text-align:center;font:800 1.55rem monospace;min-height:39px}.clue{color:var(--muted);text-align:center}.clue b{color:var(--brand)}.keyboard{display:grid;grid-template-columns:repeat(9,minmax(29px,45px));gap:6px;justify-content:center}.keyboard button,.btn{border:0;border-radius:8px;background:var(--panel);color:var(--text);padding:10px 4px;font:700 .95rem inherit;cursor:pointer}.keyboard button:disabled{opacity:.3}.keyboard .wrong{background:#55283a;color:#ffb9c8}.btn{background:var(--brand);color:white;padding:12px 28px}.hint{font-size:.82rem;color:var(--muted);text-align:center}.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:24px;background:#0d0c15e9;text-align:center}.overlay h1 span{color:var(--brand)}.overlay p{max-width:335px;line-height:1.6;color:var(--muted)}.fs{position:fixed;top:12px;right:12px;z-index:7;width:40px;height:40px;border-radius:8px;border:1px solid #ffffff33;background:#292541cc;color:white;cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<button class="fs" id="fsBtn" aria-label="全屏">⛶</button><div class="stage"><canvas id="c" width="310" height="210" aria-label="猜单词进度"></canvas></div><p class="clue">提示：<b id="clue"></b> · 错误 <b id="wrong">0 / 6</b></p><div class="word" id="word"></div><div class="keyboard" id="keyboard"></div><p class="hint">点击字母或直接使用键盘输入</p>
<div class="overlay" id="start"><h1>猜 <span>单词</span></h1><p>依据中文提示猜英文单词。六次错误前猜完全部字母即获胜，适合快速热身。</p><button class="btn" id="startBtn">开始猜词</button></div><div class="overlay" id="over" style="display:none"><h1 id="result"></h1><p id="summary"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),x=$('c').getContext('2d'),words=[['ARCADE','街机游戏'],['PUZZLE','益智谜题'],['ROCKET','火箭'],['CASTLE','城堡'],['DRAGON','龙'],['PLANET','行星'],['KEYBOARD','键盘'],['RAINBOW','彩虹']];let word,clue,used,wrong,active;function reset(){[word,clue]=words[(Math.random()*words.length)|0];used=new Set;wrong=0;active=true;$('start').style.display='none';$('over').style.display='none';$('clue').textContent=clue;render()}function draw(){x.clearRect(0,0,310,210);x.strokeStyle='#d6cdfa';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(35,190);x.lineTo(160,190);x.moveTo(75,190);x.lineTo(75,25);x.lineTo(210,25);x.lineTo(210,52);x.stroke();const parts=[()=>{x.beginPath();x.arc(210,72,20,0,7);x.stroke()},()=>{x.beginPath();x.moveTo(210,92);x.lineTo(210,142);x.stroke()},()=>{x.beginPath();x.moveTo(210,106);x.lineTo(180,125);x.stroke()},()=>{x.beginPath();x.moveTo(210,106);x.lineTo(240,125);x.stroke()},()=>{x.beginPath();x.moveTo(210,142);x.lineTo(184,170);x.stroke()},()=>{x.beginPath();x.moveTo(210,142);x.lineTo(236,170);x.stroke()}];for(let i=0;i<wrong;i++)parts[i]()}function render(){$('word').innerHTML='';[...word].forEach(ch=>{const e=document.createElement('i');e.className='letter';e.textContent=used.has(ch)||!active&&wrong>=6?ch:'';$('word').append(e)});$('wrong').textContent=wrong+' / 6';$('keyboard').innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.disabled=used.has(ch)||!active;b.className=used.has(ch)&&!word.includes(ch)?'wrong':'';b.onclick=()=>guess(ch);$('keyboard').append(b)});draw()}function guess(ch){if(!active||used.has(ch))return;used.add(ch);if(!word.includes(ch))wrong++;if([...word].every(a=>used.has(a)))return finish(true);if(wrong>=6)return finish(false);render()}function finish(win){active=false;render();$('result').textContent=win?'猜对了！':'答案揭晓';$('summary').textContent=win?`只错了 ${wrong} 次，单词是 ${word}。`:`正确答案是 ${word}。`;$('over').style.display='flex'}document.addEventListener('keydown',e=>{const ch=e.key.toUpperCase();if(/^[A-Z]$/.test(ch))guess(ch)});$('startBtn').onclick=reset;$('retryBtn').onclick=reset;$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶')})()
</script>
</body>
</html>
