<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="数独：在 9×9 宫格中填入数字 1 到 9，让每一行、列和小宫都不重复。">
<meta name="gamehub-instructions" content="先点击空格，再点击下方数字或使用键盘 1-9 填入。红色数字表示与同一行、列或宫冲突。">
<meta name="gamehub-keywords" content="数独,sudoku,益智,逻辑,经典">
<title>数独 · Sudoku</title>
<style>
  :root{--bg:#10161f;--cell:#1b2633;--line:#587085;--brand:#53d6ff;--bad:#ff6689;--text:#edf8ff;--muted:#9baebf}*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,'Microsoft YaHei',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:10px}.hud{display:flex;gap:24px;font-weight:800}.hud b{color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(9,minmax(30px,53px));border:3px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 30px #0008}.cell{aspect-ratio:1;border:0;border-right:1px solid #496174;border-bottom:1px solid #496174;background:var(--cell);color:var(--text);font:700 clamp(.9rem,3vw,1.35rem) inherit;cursor:pointer}.cell:nth-child(3n){border-right:3px solid var(--line)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid var(--line)}.cell.given{color:#a9c2d5;cursor:default}.cell.selected{background:#244b61;outline:2px solid var(--brand);z-index:1}.cell.conflict{color:var(--bad);background:#4a2434}.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(95vw,480px)}.numpad button,.btn{border:0;border-radius:8px;background:#263847;color:var(--text);padding:10px;font:700 1rem inherit;cursor:pointer}.numpad button:hover{background:#315469}.btn{background:var(--brand);color:#062331;padding:12px 28px}.hint{font-size:.82rem;color:var(--muted);text-align:center}.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:24px;background:#071019ed;text-align:center}.overlay h1 span{color:var(--brand)}.overlay p{max-width:350px;line-height:1.6;color:var(--muted)}.fs{position:fixed;top:12px;right:12px;z-index:7;width:40px;height:40px;border-radius:8px;border:1px solid #ffffff33;background:#263847cc;color:white;cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<button class="fs" id="fsBtn" aria-label="全屏">⛶</button><div class="hud"><span>错误 <b id="mistakes">0 / 3</b></span><span>填入 <b id="filled">0 / 49</b></span></div><div class="grid" id="grid" aria-label="数独棋盘"></div><div class="numpad" id="pad"></div><p class="hint">点击空格后选择数字 · 键盘 1-9 也可输入</p>
<div class="overlay" id="start"><h1>数独 <span>Sudoku</span></h1><p>每一行、每一列和每个 3×3 小宫都必须包含 1 到 9，且不能重复。三次错误后本局结束。</p><button class="btn" id="startBtn">开始解题</button></div><div class="overlay" id="over" style="display:none"><h1 id="result"></h1><p id="summary"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),grid=$('grid'),pad=$('pad');const solution=[5,3,4,6,7,8,9,1,2,6,7,2,1,9,5,3,4,8,1,9,8,3,4,2,5,6,7,8,5,9,7,6,1,4,2,3,4,2,6,8,5,3,7,9,1,7,1,3,9,2,4,8,5,6,9,6,1,5,3,7,2,8,4,2,8,7,4,1,9,6,3,5,3,4,5,2,8,6,1,7,9],givens=new Set([0,1,4,9,12,13,14,19,20,25,27,28,29,31,35,36,39,44,45,49,53,55,56,61,62,66,67,68,71,76,77,80]);let cells,selected,mistakes,done;
function reset(){cells=solution.map((v,i)=>givens.has(i)?v:0);selected=null;mistakes=0;done=false;$('start').style.display='none';$('over').style.display='none';render()}function conflict(i,v){const r=(i/9)|0,c=i%9,br=(r/3|0)*3,bc=(c/3|0)*3;for(let k=0;k<9;k++)if(cells[r*9+k]===v&&r*9+k!==i||cells[k*9+c]===v&&k*9+c!==i)return true;for(let R=br;R<br+3;R++)for(let C=bc;C<bc+3;C++)if(cells[R*9+C]===v&&R*9+C!==i)return true;return false}function render(){grid.innerHTML='';cells.forEach((v,i)=>{const e=document.createElement('button');e.className='cell'+(givens.has(i)?' given':'')+(selected===i?' selected':'')+(v&&!givens.has(i)&&conflict(i,v)?' conflict':'');e.textContent=v||'';e.dataset.i=i;grid.append(e)});$('mistakes').textContent=mistakes+' / 3';$('filled').textContent=cells.filter((v,i)=>v&&!givens.has(i)).length+' / '+(81-givens.size)}function set(n){if(done||selected===null||givens.has(selected))return;if(!n){cells[selected]=0;render();return}if(n!==solution[selected]){mistakes++;if(mistakes>=3)return finish(false)}cells[selected]=n;if(cells.every((v,i)=>v===solution[i]))return finish(true);render()}function finish(win){done=true;$('result').textContent=win?'数独完成！':'错误次数用完';$('summary').textContent=win?`仅用 ${mistakes} 次提示错误完成本局。`:'再观察一行、一列与 3×3 小宫的交集。';$('over').style.display='flex';render()}grid.onclick=e=>{const b=e.target.closest('.cell');if(!b||done||givens.has(+b.dataset.i))return;selected=+b.dataset.i;render()};for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>set(n);pad.append(b)}const erase=document.createElement('button');erase.textContent='清除';erase.onclick=()=>set(0);pad.append(erase);document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))set(+e.key);if(e.key==='Backspace'||e.key==='Delete')set(0)});$('startBtn').onclick=reset;$('retryBtn').onclick=reset;$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶')})()
</script>
</body>
</html>
