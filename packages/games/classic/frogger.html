<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="青蛙过河：穿越车流与河面，借助漂浮木头抵达顶端的安全荷叶。">
<meta name="gamehub-instructions" content="方向键、WASD 或下方按钮每次移动一格。避开车辆，河面必须站在木头上。">
<meta name="gamehub-keywords" content="青蛙过河,frogger,街机,动作,经典">
<title>青蛙过河 · Frogger</title>
<style>
  :root{--bg:#0e1820;--brand:#52e28c;--text:#ecfff3;--muted:#a9c8b3}*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,'Microsoft YaHei',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}.hud{display:flex;gap:25px;font-weight:800}.hud b{color:var(--brand)}canvas{width:min(95vw,560px);height:auto;aspect-ratio:7/9;border-radius:12px;box-shadow:0 12px 35px #0009;touch-action:none}.hint{font-size:.82rem;color:var(--muted);text-align:center}.controls{display:grid;grid-template-columns:repeat(3,50px);gap:6px}.controls button,.btn{border:0;border-radius:8px;background:#254636;color:white;font:700 1rem inherit;cursor:pointer;padding:10px}.controls .blank{visibility:hidden}.btn{background:var(--brand);color:#06351b;padding:12px 28px}.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:24px;background:#06100ae9;text-align:center}.overlay h1 span{color:var(--brand)}.overlay p{max-width:335px;line-height:1.6;color:var(--muted)}.fs{position:fixed;top:12px;right:12px;z-index:7;width:40px;height:40px;border-radius:8px;border:1px solid #ffffff33;background:#254636cc;color:white;cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<button class="fs" id="fsBtn" aria-label="全屏">⛶</button><div class="hud"><span>得分 <b id="score">0</b></span><span>生命 <b id="lives">♥♥♥</b></span><span>关卡 <b id="level">1</b></span></div><canvas id="c" width="560" height="720" aria-label="青蛙过河游戏画布"></canvas><p class="hint">方向键 / WASD 每次移动一格</p><div class="controls"><i class="blank"></i><button data-d="up">▲</button><i class="blank"></i><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
<div class="overlay" id="start"><h1>青蛙 <span>过河</span></h1><p>穿过下方车流，再借木头渡过河面。每抵达一片安全荷叶即可加分并提升关卡。</p><button class="btn" id="startBtn">开始闯关</button></div><div class="overlay" id="over" style="display:none"><h1>闯关结束</h1><p id="summary"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),W=560,S=56;let frog,cars,logs,score,lives,level,running,last;
function reset(){frog={col:4,row:12};score=0;lives=3;level=1;running=true;build();hud();$('start').style.display='none';$('over').style.display='none';last=0;requestAnimationFrame(loop)}function build(){cars=[];logs=[];for(let r=7;r<=10;r++)for(let i=0;i<3;i++)cars.push({row:r,x:i*205+(r%2?0:90),w:r%2?85:115,v:(r%2?1:-1)*(1.7+(r-7)*.25+level*.12),color:['#f15b6c','#ffc850','#64b6ff','#bc7dff'][r-7]});for(let r=1;r<=5;r++)for(let i=0;i<3;i++)logs.push({row:r,x:i*230+(r%2?0:80),w:r%2?130:170,v:(r%2?-1:1)*(1.05+r*.13+level*.1)})}function hud(){$('score').textContent=score;$('lives').textContent='♥'.repeat(lives)||'—';$('level').textContent=level}function move(d){if(!running)return;const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];frog.col=Math.max(0,Math.min(9,frog.col+m[0]));frog.row=Math.max(0,Math.min(12,frog.row+m[1]))}function death(){lives--;hud();frog={col:4,row:12};if(!lives){running=false;$('summary').textContent=`最终得分 ${score} · 到达第 ${level} 关`;$('over').style.display='flex'}}function update(){for(const a of[...cars,...logs]){a.x+=a.v;if(a.v>0&&a.x>W+20)a.x=-a.w;if(a.v<0&&a.x+a.w<-20)a.x=W+20}if(frog.row>=7&&frog.row<=10){const cx=frog.col*S+S/2;if(cars.some(q=>q.row===frog.row&&cx>q.x&&cx<q.x+q.w))death()}if(frog.row>=1&&frog.row<=5){const cx=frog.col*S+S/2;const log=logs.find(q=>q.row===frog.row&&cx>q.x&&cx<q.x+q.w);if(!log)death();else{frog.col=Math.max(0,Math.min(9,Math.floor((frog.col*S+log.v)/S)))}}if(frog.row===0){score+=100+level*20;level++;frog={col:4,row:12};build();hud()}}function draw(){x.fillStyle='#59b06b';x.fillRect(0,0,W,720);x.fillStyle='#155986';x.fillRect(0,S,W,S*5);x.fillStyle='#2c3239';x.fillRect(0,S*7,W,S*4);x.fillStyle='#267e47';x.fillRect(0,S*11,W,S*2);x.strokeStyle='#d8e9bb';x.setLineDash([18,18]);for(let r=7;r<=10;r++){x.beginPath();x.moveTo(0,r*S+S/2);x.lineTo(W,r*S+S/2);x.stroke()}x.setLineDash([]);x.fillStyle='#9a6338';logs.forEach(q=>{x.fillStyle='#956239';x.fillRect(q.x,q.row*S+12,q.w,32);x.fillStyle='#b98453';x.fillRect(q.x+8,q.row*S+19,q.w-16,7)});cars.forEach(q=>{x.fillStyle=q.color;x.fillRect(q.x,q.row*S+11,q.w,34);x.fillStyle='#d9f1ff';x.fillRect(q.x+12,q.row*S+16,20,10);x.fillRect(q.x+q.w-32,q.row*S+16,20,10)});for(let n=0;n<5;n++){x.fillStyle='#92df75';x.beginPath();x.arc(55+n*112,25,21,0,7);x.fill()}const fx=frog.col*S+28,fy=frog.row*S+28;x.fillStyle='#52e28c';x.beginPath();x.arc(fx,fy,20,0,7);x.fill();x.fillStyle='#071';x.fillRect(fx-11,fy-16,5,5);x.fillRect(fx+6,fy-16,5,5)}function loop(t){if(!running)return;if(t-last>16){update();draw();last=t}requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{const d={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(d){e.preventDefault();move(d)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));$('startBtn').onclick=reset;$('retryBtn').onclick=reset;$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶')})()
</script>
</body>
</html>
