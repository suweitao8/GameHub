<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="太空入侵者：移动战机击退不断逼近的外星舰队，守住三条生命。">
<meta name="gamehub-instructions" content="方向键或 A/D 移动，空格键发射。触屏可使用下方控制按钮。击败所有外星人进入下一波。">
<meta name="gamehub-keywords" content="太空入侵者,space invaders,街机,射击,经典">
<title>太空入侵者 · Space Invaders</title>
<style>
  :root{--bg:#07111d;--panel:#102437;--brand:#39d9ff;--accent:#ff6b9a;--text:#eaf6ff;--muted:#9bb3c6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,'Microsoft YaHei',sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}.hud{display:flex;gap:28px;font-weight:800}.hud b{color:var(--brand)}.hud .life{color:var(--accent)}
  canvas{width:min(94vw,680px);height:auto;aspect-ratio:4/3;background:radial-gradient(circle at 50% 0,#153758,#07111d 65%);border:1px solid rgba(57,217,255,.25);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.45);touch-action:none}
  .hint{font-size:.82rem;color:var(--muted);text-align:center}.controls{display:flex;gap:12px}.controls button,.btn{border:0;border-radius:9px;background:var(--panel);color:var(--text);font:700 1rem inherit;padding:10px 18px;cursor:pointer}.controls button:active,.btn:active{transform:scale(.95)}.btn{background:var(--brand);color:#06131d;padding:12px 30px}.overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(3,10,18,.91);text-align:center;padding:24px}.overlay h1{font-size:clamp(1.8rem,5vw,2.6rem)}.overlay h1 span{color:var(--brand)}.overlay p{max-width:340px;color:var(--muted);line-height:1.6}.fs{position:fixed;top:12px;right:12px;z-index:7;width:40px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(16,36,55,.9);color:var(--text);font-size:1.1rem;cursor:pointer}
</style>
</head>
<body>
<button class="fs" id="fsBtn" aria-label="全屏">⛶</button>
<div class="hud"><span>得分 <b id="score">0</b></span><span>波次 <b id="wave">1</b></span><span class="life">生命 <b id="lives">♥♥♥</b></span></div>
<canvas id="c" width="680" height="510" aria-label="太空入侵者游戏画布"></canvas>
<p class="hint">← → / A D 移动 · 空格发射</p><div class="controls"><button id="leftBtn">◀</button><button id="fireBtn">发射</button><button id="rightBtn">▶</button></div>
<div class="overlay" id="start"><h1>太空 <span>入侵者</span></h1><p>击退不断逼近的外星舰队。清空一波会加速下一波，别让它们突破防线。</p><button class="btn" id="startBtn">开始出击</button></div>
<div class="overlay" id="over" style="display:none"><h1 id="result"></h1><p id="summary"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=c.width,H=c.height;let keys={},ship,bullets,enemies,enemyShots,score,wave,lives,running,last,dir,moveTick,shotTick;
const reset=()=>{ship={x:W/2,y:H-52,w:42,h:18,cd:0};bullets=[];enemyShots=[];score=0;wave=1;lives=3;running=true;$('start').style.display='none';$('over').style.display='none';makeWave();hud();last=0;requestAnimationFrame(loop)};
const makeWave=()=>{enemies=[];for(let r=0;r<4;r++)for(let col=0;col<9;col++)enemies.push({x:105+col*58,y:55+r*42,w:30,h:22,row:r,dead:false});dir=1;moveTick=0;shotTick=0};
const hud=()=>{$('score').textContent=score;$('wave').textContent=wave;$('lives').textContent='♥'.repeat(lives)||'—'};
const fire=()=>{if(ship.cd<=0){bullets.push({x:ship.x,y:ship.y-10,vy:-10});ship.cd=13}};
const hit=(a,b)=>Math.abs(a.x-b.x)<(a.w||8)/2+(b.w||8)/2&&Math.abs(a.y-b.y)<(a.h||8)/2+(b.h||8)/2;
function update(){if(keys.ArrowLeft||keys.a||keys.A)ship.x=Math.max(25,ship.x-7);if(keys.ArrowRight||keys.d||keys.D)ship.x=Math.min(W-25,ship.x+7);if(keys[' '])fire();ship.cd--;bullets.forEach(b=>b.y+=b.vy);bullets=bullets.filter(b=>b.y>-10);moveTick++;shotTick++;
if(moveTick>Math.max(7,20-wave*2)){moveTick=0;let edge=false;for(const e of enemies)if(!e.dead&&(e.x+(dir>0?e.w/2:-e.w/2)>W-18||e.x+(dir>0?e.w/2:-e.w/2)<18))edge=true;if(edge){dir*=-1;enemies.forEach(e=>e.y+=18)}else enemies.forEach(e=>e.x+=dir*(4+wave*.45))}
for(const b of bullets)for(const e of enemies)if(!e.dead&&hit(b,e)){e.dead=true;b.y=-20;score+=10+(3-e.row)*5;hud()}if(shotTick>Math.max(28,80-wave*6)){shotTick=0;const alive=enemies.filter(e=>!e.dead);if(alive.length){const e=alive[(Math.random()*alive.length)|0];enemyShots.push({x:e.x,y:e.y+15,vy:4+wave*.35})}}
enemyShots.forEach(b=>b.y+=b.vy);enemyShots=enemyShots.filter(b=>b.y<H+15);for(const b of enemyShots)if(Math.abs(b.x-ship.x)<24&&Math.abs(b.y-ship.y)<18){b.y=H+20;lives--;hud();if(!lives)return end(false)}if(enemies.some(e=>!e.dead&&e.y>H-92))return end(false);if(enemies.every(e=>e.dead)){wave++;score+=100;hud();makeWave()}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<55;i++){const sx=(i*127)%W,sy=(i*61)%H;x.fillRect(sx,sy,1,1)}x.fillStyle='#39d9ff';x.beginPath();x.moveTo(ship.x,ship.y-15);x.lineTo(ship.x-22,ship.y+15);x.lineTo(ship.x+22,ship.y+15);x.fill();x.fillStyle='#fff';bullets.forEach(b=>x.fillRect(b.x-2,b.y-7,4,14));x.fillStyle='#ff719b';enemyShots.forEach(b=>x.fillRect(b.x-2,b.y-5,4,10));for(const e of enemies)if(!e.dead){x.fillStyle=['#ff7aac','#ffd166','#57e5b8','#72b7ff'][e.row];x.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);x.fillStyle='#07111d';x.fillRect(e.x-8,e.y-3,5,5);x.fillRect(e.x+3,e.y-3,5,5)}x.fillStyle='rgba(57,217,255,.16)';x.fillRect(0,H-42,W,2)}
function loop(t){if(!running)return;if(t-last>16){update();draw();last=t}requestAnimationFrame(loop)}function end(win){running=false;$('result').textContent=win?'舰队已击退！':'防线失守';$('summary').textContent=`最终得分 ${score} · 抵达第 ${wave} 波`;$('over').style.display='flex'}
document.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);[['leftBtn','ArrowLeft'],['rightBtn','ArrowRight']].forEach(([id,key])=>{const b=$(id);b.onpointerdown=()=>keys[key]=true;b.onpointerup=b.onpointerleave=()=>keys[key]=false});$('fireBtn').onpointerdown=fire;$('startBtn').onclick=reset;$('retryBtn').onclick=reset;$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'✕':'⛶')})()
</script>
</body>
</html>
