<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="2048 数字合并：滑动方块让相同数字合并，挑战合成更大的数字。">
<meta name="gamehub-instructions" content="方向键或 WASD 滑动所有方块，相同数字相撞会合并并翻倍，目标是合成 2048。">
<meta name="gamehub-keywords" content="2048,数字,合并,益智,经典">
<title>2048 · 数字合并</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2028; --cell:#243040; --brand:#00aeec; --accent:#fb7299; --text:#e6edf3; --muted:#8b98a5; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:12px; }
  .topbar { display:flex; gap:24px; align-items:center; width:380px; max-width:90vw; }
  .topbar h1 { font-size:1.8rem; font-weight:900; letter-spacing:-.02em; flex:1; }
  .topbar h1 .hl{color:var(--brand);}
  .scores { display:flex; gap:8px; }
  .sc { background:var(--panel); border-radius:8px; padding:8px 14px; text-align:center; min-width:70px; }
  .sc .l { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .sc .v { font-size:1.2rem; font-weight:800; color:var(--brand); }
  .board-wrap { display:flex; align-items:center; justify-content:center; }
  .board { position:relative; background:var(--panel); border-radius:12px; padding:10px; box-shadow:0 8px 30px rgba(0,0,0,.4); transform-origin:center; }
  .grid { display:grid; grid-template-columns:repeat(4,80px); grid-template-rows:repeat(4,80px); gap:10px; }
  .cell-bg { background:var(--cell); border-radius:8px; }
  .tile { position:absolute; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; transition:all .12s ease; }
  .fs-btn { position:fixed; top:12px; right:12px; z-index:20; background:rgba(26,32,40,.85); border:1px solid rgba(255,255,255,.12); color:var(--text); width:40px; height:40px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:background .15s; }
  .fs-btn:hover { background:rgba(0,174,236,.85); }
  :fullscreen .topbar h1 { font-size:2.4rem; }
  :fullscreen .sc .v { font-size:1.6rem; }
  :fullscreen .hint { font-size:1rem; }
  .hint { font-size:0.82rem; color:var(--muted); }
  .overlay { position:fixed; inset:0; background:rgba(15,20,25,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10; }
  .overlay h1 { font-size:2rem; }
  .overlay p { color:var(--muted); font-size:0.92rem; text-align:center; line-height:1.6; }
  .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 32px; font-size:1rem; font-weight:700; cursor:pointer; }
  .btn:hover{background:#0096cc;} .btn:active{transform:scale(.96);}
</style>
</head>
<body>
  <button class="fs-btn" id="fsBtn" aria-label="全屏" title="全屏">⛶</button>
  <div class="topbar">
    <h1><span class="hl">2048</span></h1>
    <div class="scores">
      <div class="sc"><div class="l">得分</div><div class="v" id="score">0</div></div>
      <div class="sc"><div class="l">最高</div><div class="v" id="best" style="color:var(--accent)">0</div></div>
    </div>
  </div>
  <div class="board-wrap">
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
  </div>
  </div>
  <p class="hint">方向键 / WASD 滑动方块 · 相同数字合并</p>

  <div class="overlay" id="over" style="display:none">
    <h1 id="overTitle">游戏结束</h1>
    <p id="overText"></p>
    <button class="btn" id="retryBtn">再来一局</button>
  </div>

<script>
(()=>{
  const N=4, CELL=80, GAP=10, PAD=10;
  const board=document.getElementById('board');
  const grid=document.getElementById('grid');
  const $score=document.getElementById('score'),$best=document.getElementById('best');
  const $over=document.getElementById('over'),$overTitle=document.getElementById('overTitle'),$overText=document.getElementById('overText');

  board.style.width=board.style.height=(N*CELL+(N-1)*GAP+PAD*2)+'px';
  for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell-bg';grid.appendChild(d);}

  let tiles,score,best=0,won,over;

  const COLORS={
    2:['#2a3441','#e6edf3'],4:['#2d3a4a','#e6edf3'],8:['#00aeec','#fff'],16:['#0096cc','#fff'],
    32:['#fb7299','#fff'],64:['#e95b86','#fff'],128:['#ff8c42','#fff'],256:['#ff6b1a','#fff'],
    512:['#a371f7','#fff'],1024:['#7b4ddb','#fff'],2048:['#ffd33d','#1a2028'],4096:['#00c091','#fff']
  };

  function reset(){
    tiles=Array.from({length:N},()=>Array(N).fill(0));
    score=0;won=false;over=false;
    $score.textContent=0;$over.style.display='none';
    addRandom();addRandom();render();
  }

  function addRandom(){
    const empty=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(!tiles[y][x]) empty.push([x,y]);
    if(!empty.length) return;
    const [x,y]=empty[(Math.random()*empty.length)|0];
    tiles[y][x]=Math.random()<0.9?2:4;
  }

  function render(){
    board.querySelectorAll('.tile').forEach(t=>t.remove());
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const v=tiles[y][x]; if(!v) continue;
      const el=document.createElement('div'); el.className='tile';
      const [bg,fg]=COLORS[v]||['#00c091','#fff'];
      el.style.cssText='left:'+(PAD+x*(CELL+GAP))+'px;top:'+(PAD+y*(CELL+GAP))+'px;width:'+CELL+'px;height:'+CELL+'px;background:'+bg+';color:'+fg+';font-size:'+(v<100?34:v<1000?28:v<10000?24:20)+'px;';
      el.textContent=v;
      board.appendChild(el);
    }
  }

  function slide(row){
    let a=row.filter(v=>v); let gained=0;
    for(let i=0;i<a.length-1;i++){
      if(a[i]===a[i+1]){ a[i]*=2; gained+=a[i]; a.splice(i+1,1); if(a[i]===2048) won=true; }
    }
    while(a.length<N) a.push(0);
    return [a,gained];
  }

  function move(dir){
    if(over) return;
    const before=JSON.stringify(tiles);
    let gained=0;
    if(dir==='left'){
      for(let y=0;y<N;y++){const [r,g]=slide(tiles[y]);tiles[y]=r;gained+=g;}
    } else if(dir==='right'){
      for(let y=0;y<N;y++){const [r,g]=slide(tiles[y].slice().reverse()).map(v=>Array.isArray(v)?v.reverse():v);const res=r;tiles[y]=res;gained+=g;}
    } else if(dir==='up'){
      for(let x=0;x<N;x++){let col=[];for(let y=0;y<N;y++)col.push(tiles[y][x]);const [r,g]=slide(col);for(let y=0;y<N;y++)tiles[y][x]=r[y];gained+=g;}
    } else if(dir==='down'){
      for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--)col.push(tiles[y][x]);const [r,g]=slide(col);for(let y=N-1,i=0;y>=0;y--,i++)tiles[y][x]=r[i];gained+=g;}
    }

    if(JSON.stringify(tiles)!==before){
      score+=gained; $score.textContent=score;
      if(score>best){best=score;$best.textContent=best;}
      addRandom(); render();
      if(won&&!document.getElementById('wonFlag')){
        $overTitle.textContent='合成 2048！';$overText.innerHTML='你赢了！得分 <b style="color:var(--accent);font-size:1.5rem">'+score+'</b><br>可以继续挑战更大数字。';
        $over.style.display='flex';
        const f=document.createElement('div');f.id='wonFlag';f.style.display='none';board.appendChild(f);
      } else if(!canMove()){
        over=true;$overTitle.textContent='游戏结束';$overText.innerHTML='无法移动了。得分 <b style="color:var(--accent);font-size:1.5rem">'+score+'</b>';
        $over.style.display='flex';
      }
    }
  }

  function canMove(){
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      if(!tiles[y][x]) return true;
      if(x<N-1&&tiles[y][x]===tiles[y][x+1]) return true;
      if(y<N-1&&tiles[y][x]===tiles[y+1][x]) return true;
    }
    return false;
  }

  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const map={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'up','w':'up','arrowdown':'down','s':'down'};
    if(map[k]){ move(map[k]); e.preventDefault(); }
  });

  let ts;
  board.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  board.addEventListener('touchend',e=>{
    if(!ts) return;
    const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
    if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
    ts=null;
  },{passive:true});

  document.getElementById('retryBtn').addEventListener('click',()=>{
    if(won&&!over){ document.getElementById('wonFlag')?.remove(); $over.style.display='none'; won=true; }
    else reset();
  });

  // 响应式缩放：board 原始 370px，按可用空间等比放大
  const BOARD_SIZE=370;
  function fitBoard(){
    const availW=Math.min(window.innerWidth-32, 760);
    const availH=window.innerHeight-180;
    const scale=Math.max(0.6, Math.min(availW/BOARD_SIZE, availH/BOARD_SIZE, 1.8));
    board.style.transform='scale('+scale+')';
  }
  window.addEventListener('resize', fitBoard);
  document.addEventListener('fullscreenchange', ()=>{ fitBoard(); fsBtn.textContent=document.fullscreenElement?'✕':'⛶'; });

  const fsBtn=document.getElementById('fsBtn');
  fsBtn.addEventListener('click', ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });

  fitBoard();
  reset();
})();
</script>
</body>
</html>
