<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="gamehub-description" content="吃豆人：在迷宫里吃光所有豆子，躲开四个幽灵，吃到大豆子可反吃幽灵。">
<meta name="gamehub-instructions" content="方向键或 WASD 控制吃豆人移动，吃光所有豆子获胜。吃闪烁的大豆子后可短暂吃掉幽灵。">
<meta name="gamehub-keywords" content="吃豆人,pac-man,迷宫,经典,动作">
<title>吃豆人 · Pac-Man</title>
<style>
  :root{--bg:#0f1419;--panel:#0a0e2a;--brand:#ffd33d;--accent:#fb7299;--text:#e6edf3;--muted:#8b98a5;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;}
  .hud{display:flex;gap:32px;font-weight:800;font-size:1.2rem;}
  .hud .s{color:var(--brand);}
  .hud .l{color:var(--accent);}
  canvas{background:var(--panel);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:100%;max-height:calc(100vh - 120px);width:auto;height:auto;aspect-ratio:1/1;touch-action:none;}
  .hint{font-size:0.82rem;color:var(--muted);}
  .overlay{position:fixed;inset:0;background:rgba(15,20,25,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;}
  .overlay h1{font-size:2rem;}.overlay h1 .hl{color:var(--brand);}
  .overlay p{color:var(--muted);font-size:0.92rem;text-align:center;line-height:1.6;max-width:320px;}
  .btn{background:var(--brand);color:#1a2028;border:0;border-radius:8px;padding:12px 32px;font-size:1rem;font-weight:700;cursor:pointer;}
  .btn:hover{background:#ffdf66;}
  .fs-btn{position:fixed;top:12px;right:12px;z-index:20;background:rgba(26,32,40,.85);border:1px solid rgba(255,255,255,.12);color:var(--text);width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .fs-btn:hover{background:rgba(0,174,236,.85);}
  :fullscreen canvas{max-height:calc(100vh - 100px);}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn">⛶</button>
<div class="hud"><span class="s">得分 <span id="score">0</span></span><span class="l">生命 <span id="lives">3</span></span></div>
<canvas id="c"></canvas>
<p class="hint">方向键 / WASD 移动</p>
<div class="overlay" id="start"><h1>吃豆人 <span class="hl">Pac-Man</span></h1><p>吃光迷宫里所有豆子获胜，躲开四个幽灵。吃闪烁的大豆子后可反吃幽灵。</p><button class="btn" id="startBtn">开始游戏</button></div>
<div class="overlay" id="over" style="display:none"><h1 id="ot"></h1><p id="om"></p><button class="btn" id="retryBtn">再来一局</button></div>
<script>
(()=>{
// 迷宫: # 墙, . 豆, o 大豆, 空格 空, G 幽灵出生点, P 玩家出生点
const MAZE=[
'###############','#.............#','#o###.#.#.###o#','#.............#','#.###.#.#.###.#','#.....G.......#','#.###.###.###.#','#.............#','#.#.#######.#.#','#o...........o#','#.#.#######.#.#','#.............#','###############'
];
const ROWS=MAZE.length,COLS=MAZE[0].length,CELL=32;
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=COLS*CELL;c.height=ROWS*CELL;
const $score=document.getElementById('score'),$lives=document.getElementById('lives'),$start=document.getElementById('start'),$over=document.getElementById('over'),$ot=document.getElementById('ot'),$om=document.getElementById('om');
let grid,pac,ghosts,score,lives,powerTimer,running,dead,won;
const GHOST_COLORS=['#fb7299','#00aeec','#ff8c42','#a371f7'];
function reset(){
grid=MAZE.map(r=>r.split(''));
pac={x:7,y:5,dir:{x:0,y:0},nextDir:{x:0,y:0}};
ghosts=[];let gi=0;
for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
if(grid[i][j]==='G'){ghosts.push({x:j,y:i,dir:{x:1,y:0},color:GHOST_COLORS[gi%4],home:{x:j,y:i}});gi++;grid[i][j]=' ';}
if(grid[i][j]==='P'){pac.x=j;pac.y=i;grid[i][j]=' ';}
}
score=0;lives=3;powerTimer=0;dead=false;won=false;
$score.textContent=0;$lives.textContent=3;$start.style.display='none';$over.style.display='none';
running=true;lastMove=0;requestAnimationFrame(loop);
}
function isWall(x,y){if(y<0||y>=ROWS||x<0||x>=COLS)return true;return grid[y][x]==='#';}
function canMove(px,py,d){return !isWall(px+d.x,py+d.y);}
let lastMove=0,MOVE_INT=140;
function moveActor(a){
if(canMove(a.x,a.y,a.nextDir))a.dir=a.nextDir;
if(canMove(a.x,a.y,a.dir)){a.x+=a.dir.x;a.y+=a.dir.y;}
}
function update(){
// 玩家
moveActor(pac);
const cell=grid[pac.y][pac.x];
if(cell==='.'){grid[pac.y][pac.x]=' ';score+=10;$score.textContent=score;}
else if(cell==='o'){grid[pac.y][pac.x]=' ';score+=50;$score.textContent=score;powerTimer=40;}
if(powerTimer>0)powerTimer--;
// 检查吃光
let dots=0;for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(grid[i][j]==='.'||grid[i][j]==='o')dots++;
if(dots===0){won=true;return end(true);}
// 幽灵
ghosts.forEach(g=>{
// AI: 简单——能转就随机转向，否则继续；30%朝玩家
const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>canMove(g.x,g.y,d));
const opp={x:-g.dir.x,y:-g.dir.y};
let valid=dirs.filter(d=>!(d.x===opp.x&&d.y===opp.y));
if(valid.length===0)valid=dirs;
if(Math.random()<0.35){
// 朝玩家
valid.sort((a,b)=>{
const da=Math.abs(g.x+a.x-pac.x)+Math.abs(g.y+a.y-pac.y);
const db=Math.abs(g.x+b.x-pac.x)+Math.abs(g.y+b.y-pac.y);
return da-db;
});
}
g.dir=valid[0]||g.dir;
if(canMove(g.x,g.y,g.dir)){g.x+=g.dir.x;g.y+=g.dir.y;}
});
// 碰撞
ghosts.forEach(g=>{
if(g.x===pac.x&&g.y===pac.y){
if(powerTimer>0){score+=200;$score.textContent=score;g.x=g.home.x;g.y=g.home.y;}
else{lives--;$lives.textContent=lives;if(lives<=0){dead=true;return end(false);}resetPositions();}
}
});
}
function resetPositions(){
// 找玩家初始位置(中心区域)
pac.x=7;pac.y=5;pac.dir={x:0,y:0};pac.nextDir={x:0,y:0};
ghosts.forEach(g=>{g.x=g.home.x;g.y=g.home.y;g.dir={x:1,y:0};});
}
function end(win){running=false;$ot.textContent=win?'通关！':'被幽灵抓住了';$om.innerHTML=win?'得分 <b style="color:var(--brand)">'+score+'</b>':'得分 <b style="color:var(--accent)">'+score+'</b>';setTimeout(()=>{$over.style.display='flex';},300);}
function draw(){
x.fillStyle='#0a0e2a';x.fillRect(0,0,c.width,c.height);
// 墙和豆
for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
const cell=grid[i][j];
if(cell==='#'){x.fillStyle='#1d3a8a';roundRect(j*CELL+2,i*CELL+2,CELL-4,CELL-4,5);x.fill();}
else if(cell==='.'){x.fillStyle='#ffd33d';x.beginPath();x.arc(j*CELL+CELL/2,i*CELL+CELL/2,3,0,7);x.fill();}
else if(cell==='o'){x.fillStyle=powerTimer>0&&powerTimer%4<2?'#666':'#ffd33d';x.beginPath();x.arc(j*CELL+CELL/2,i*CELL+CELL/2,7,0,7);x.fill();}
}
// 玩家
const px=pac.x*CELL+CELL/2,py=pac.y*CELL+CELL/2;
x.fillStyle='#ffd33d';x.beginPath();
const mouth=Math.abs(Math.sin(Date.now()/100))*0.35+0.05;
const ang=Math.atan2(pac.dir.y,pac.dir.x)||0;
x.arc(px,py,CELL*0.42,ang+mouth*Math.PI,ang-mouth*Math.PI+Math.PI*2);x.lineTo(px,py);x.fill();
// 幽灵
ghosts.forEach(g=>{
const gx=g.x*CELL+CELL/2,gy=g.y*CELL+CELL/2;
const fright=powerTimer>0;
x.fillStyle=fright?(powerTimer%8<4?'#fff':'#1a3a8a'):'#fb7299';
x.beginPath();x.arc(gx,gy-2,CELL*0.4,Math.PI,0);x.lineTo(gx+CELL*0.4,gy+CELL*0.35);
for(let i=0;i<3;i++){const w=CELL*0.4/1.5;x.lineTo(gx+CELL*0.4-w*i-w/2,gy+CELL*0.25);x.lineTo(gx+CELL*0.4-w*(i+1),gy+CELL*0.35);}
x.lineTo(gx-CELL*0.4,gy+CELL*0.35);x.closePath();x.fill();
// 眼睛
x.fillStyle='#fff';x.beginPath();x.arc(gx-5,gy-3,4,0,7);x.arc(gx+5,gy-3,4,0,7);x.fill();
x.fillStyle=fright?'#f00':'#0a0e2a';x.beginPath();x.arc(gx-5+g.dir.x*2,gy-3+g.dir.y*2,2,0,7);x.arc(gx+5+g.dir.x*2,gy-3+g.dir.y*2,2,0,7);x.fill();
});
}
function roundRect(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function loop(t){
if(!running)return;
if(!lastMove)lastMove=t;
if(t-lastMove>=MOVE_INT){update();lastMove=t;if(!running)return;}
draw();requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{
const k=e.key.toLowerCase();
if(k==='arrowup'||k==='w')pac.nextDir={x:0,y:-1};
else if(k==='arrowdown'||k==='s')pac.nextDir={x:0,y:1};
else if(k==='arrowleft'||k==='a')pac.nextDir={x:-1,y:0};
else if(k==='arrowright'||k==='d')pac.nextDir={x:1,y:0};
if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
});
let ts;
c.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
c.addEventListener('touchend',e=>{if(!ts)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)>Math.abs(dy))pac.nextDir={x:dx>0?1:-1,y:0};else pac.nextDir={x:0,y:dy>0?1:-1};ts=null;},{passive:true});
document.getElementById('startBtn').addEventListener('click',reset);
document.getElementById('retryBtn').addEventListener('click',reset);
const fsBtn=document.getElementById('fsBtn');
fsBtn.addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();});
document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'✕':'⛶';});
})();
</script>
</body>
</html>
