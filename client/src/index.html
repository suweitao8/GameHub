  <!-- 3. Display the application -->
  <body id="custom-css">

    <noscript class="alert alert-light">
      <h2 class="mb-3">需要启用 JavaScript</h2>

      <p>您的浏览器似乎阻止或禁用了 JavaScript。我们理解您的选择，但此页面必须启用 JavaScript 才能正常工作。</p>
      <hr>

      <h2 class="mb-3">您可以尝试</h2>

      <ul>
        <li>在浏览器中允许 JavaScript</li>
        <li>查看网站源代码，并向网站所有者提出修改建议</li>
      </ul>
    </noscript>

    <div id="incompatible-browser" class="alert alert-light" role="alert" style="display: none">
      <h2 class="mb-3">浏览器不兼容</h2>

      <p>很抱歉，GameHub 与您当前的浏览器不兼容。</p>

      <hr>
      <p>请尝试使用最新版本的浏览器。</p>
    </div>

    <script type="text/javascript">
      function displayIncompatibleBrowser () {
        var elem = document.getElementById('incompatible-browser')
        if (elem.className.indexOf('browser-ok') === -1) {
          elem.style.display = 'block'
        }
      }

      window.onerror = function () {
        displayIncompatibleBrowser()
      }

      if (/MSIE|Trident/.test(window.navigator.userAgent) ) {
        displayIncompatibleBrowser()
      }

      // BigInt must be supported
      try {
        BigInt(9007199254740991)
      } catch (err) {
        console.error('此浏览器不支持 BigInt')

        displayIncompatibleBrowser()
      }
    </script>

    <my-app>
    </my-app>

  </body>
</html>
