  <!-- 3. Display the application -->
  <body id="custom-css">

    <noscript class="alert alert-light">
      <h2 class="mb-3">JavaScript required</h2>

      <p>It seems JavaScript is either blocked or disabled in your web browser. We totally get that. However, this page will not work without it.</p>
      <hr>

      <h2 class="mb-3">Your options</h2>

      <ul>
        <li>Allow JavaScript in your browser</li>
        <li>Review the source code of the site and ask for modifications from the site owner</li>
      </ul>
    </noscript>

    <div id="incompatible-browser" class="alert alert-light" role="alert" style="display: none">
      <h2 class="mb-3">Incompatible browser</h2>

      <p>We are sorry but it seems that GameHub is not compatible with your web browser.</p>

      <hr>
      <p>Please try with the latest version of your browser.</p>
    </div>

    <script type="text/javascript">
      function displayIncompatibleBrowser () {
        var elem = document.getElementById('incompatible-browser')
        if (elem.className.indexOf('browser-ok') === -1) {
          elem.style.display = 'block'
        }
      }

      window.onerror = function () {
        displayIncompatibleBrowser()
      }

      if (/MSIE|Trident/.test(window.navigator.userAgent) ) {
        displayIncompatibleBrowser()
      }

      // BigInt must be supported
      try {
        BigInt(9007199254740991)
      } catch (err) {
        console.error('BigInt is not supported on this web browser')

        displayIncompatibleBrowser()
      }
    </script>

    <my-app>
    </my-app>

  </body>
</html>
