<section class="featured-section" aria-label="推荐游戏">
  <div class="section-with-side-action">
    <div class="featured-discovery-grid">
      @if (carouselGame(); as featuredGame) {
        <article
          class="featured-carousel"
          (touchstart)="onCarouselTouchStart($event)"
          (touchend)="onCarouselTouchEnd($event)"
        >
          <a class="featured-carousel-link" [routerLink]="['/games', featuredGame.uuid]">
            <div class="featured-cover" [class.is-placeholder]="!featuredCoverPath(featuredGame)">
              @if (featuredCoverPath(featuredGame); as coverPath) {
                <img [src]="coverPath" [alt]="featuredGame.title + ' 封面'" loading="eager" decoding="async" (error)="onFeaturedCoverError(featuredGame.uuid)" (load)="onFeaturedImageLoad($event, featuredGame.uuid)">
              } @else {
                <div class="featured-cover-fallback" aria-hidden="true">
                  <span class="featured-cover-letter">G</span>
                  <div class="featured-cover-copy">
                    <strong>{{ featuredGame.title }}</strong>
                    <small>推荐游戏</small>
                  </div>
                </div>
              }
              <!-- Cover bottom 1/6: avg-color opacity fade (same idea as .game-card-meta) -->
              <div class="featured-cover-fade" aria-hidden="true" [style.background]="featuredCoverFade(featuredGame)"></div>
            </div>
          </a>
          <!-- Solid avg-color footer: title above, switch controls below — never overlap -->
          <div class="featured-footer" [style.background-color]="featuredAvgColor(featuredGame)">
            <a class="featured-caption" [routerLink]="['/games', featuredGame.uuid]">
              <h3>{{ featuredGame.title }}</h3>
            </a>
            <div class="featured-controls">
              <div class="featured-dots">
                @for (game of carouselGames(); track game.uuid; let index = $index) {
                  <button type="button" [class.active]="index === carouselIndex()" [attr.aria-label]="'第 ' + (index + 1) + ' 个推荐'" [title]="game.title" (click)="carouselIndex.set(index); $event.stopPropagation()"></button>
                }
              </div>
              <div>
                <button type="button" aria-label="上一个推荐" (click)="nextCarousel(-1); $event.stopPropagation()"><my-global-icon iconName="chevron-left" /></button>
                <button type="button" aria-label="下一个推荐" (click)="nextCarousel(1); $event.stopPropagation()"><my-global-icon class="icon-flip-horizontal" iconName="chevron-left" /></button>
              </div>
            </div>
          </div>
        </article>
      }
      <div class="featured-side-grid">@for (game of sideGames(); track game.uuid) { <my-game-card [game]="game" [searchTerm]="searchTerm()" /> }</div>
    </div>
    <button class="section-side-action" type="button" aria-label="换一批推荐游戏" (click)="shuffle.emit()"><my-global-icon class="section-side-action-icon" iconName="refresh" /><span class="section-side-action-label">换一批</span></button>
  </div>
</section>
