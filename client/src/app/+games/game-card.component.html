<a class="game-card" [routerLink]="['/games', game.uuid]" [attr.aria-label]="'打开游戏：' + game.title">
  <div class="game-cover" [class.placeholder]="!game.coverPath">
    @if (game.coverPath) {
      <img [src]="game.coverPath" [alt]="game.title + ' 封面'" loading="lazy">
    } @else {
      <span class="cover-letter" aria-hidden="true">{{ game.title.charAt(0) || 'G' }}</span>
    }
    <span class="play-hint">立即试玩</span>
  </div>
  <div class="game-card-body">
    <h3>{{ game.title }}</h3>
    <div class="game-card-author">
      <img class="author-avatar" [src]="getAuthorAvatar(game.author?.displayName || game.author?.name)" alt="" loading="lazy">
      <span>{{ game.author?.displayName || '独立创作者' }}</span>
      <span class="game-card-time">· {{ formatDate(game.publishedAt || game.createdAt) }}</span>
    </div>
    <div class="game-card-meta" aria-label="游戏数据">
      <span class="game-card-stat"><span aria-hidden="true">▶</span>{{ formatCount(game.playCount) }} 次游玩</span>
      <span class="game-card-stat"><span aria-hidden="true">▤</span>{{ formatCount(game.comments) }} 条评论</span>
    </div>
  </div>
</a>
