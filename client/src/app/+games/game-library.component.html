<main class="game-community-page library-page"><div class="game-community-content"><a routerLink="/games" class="back-link">← 返回游戏社区</a><header><p class="game-eyebrow">YOUR LIBRARY</p><h1>我的游戏</h1><p>收藏、最近游玩和自己发布的作品都在这里。</p></header><nav class="library-tabs" aria-label="我的游戏分类"><button type="button" [class.active]="tab() === 'recent'" (click)="selectTab('recent')">最近游玩</button><button type="button" [class.active]="tab() === 'favorites'" (click)="selectTab('favorites')">我的收藏</button><button type="button" [class.active]="tab() === 'owned'" (click)="selectTab('owned')">我的创作</button></nav>@if (error()) { <p class="library-error" role="alert">{{ error() }}</p> }<div class="game-grid">@for (game of games(); track game.uuid) { <div class="library-game-item"><my-game-card [game]="game" /><a class="library-download" [href]="getDownloadUrl(game.uuid)">下载游戏包</a></div> } @empty { @if (!error()) { <div class="library-empty">这里还没有内容，去发现一款游戏吧。</div> } }</div></div></main>
