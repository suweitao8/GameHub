<main class="game-form-page margin-content">
  <p class="eyebrow">创作中心</p>
  <h1>编辑游戏</h1>
  @if (loading()) { <div class="game-skeleton-form"><div class="game-skeleton-field shimmer"></div><div class="game-skeleton-field shimmer"></div><div class="game-skeleton-field shimmer"></div><div class="game-skeleton-field shimmer"></div><div class="game-skeleton-field shimmer"></div></div> }
  @if (!loading()) {
    <form (submit)="$event.preventDefault(); submit()" class="game-form" novalidate>
      <label class="file-input-label">替换游戏文件（可选）
        <input type="file" accept=".html,.htm,text/html,application/xhtml+xml" (change)="onFileChange($event)" [attr.aria-invalid]="fileError() ? 'true' : 'false'" [attr.aria-describedby]="fileError() ? 'file-error' : null">
        @if (fileError()) { <p id="file-error" class="field-hint error" role="alert">{{ fileError() }}</p> }
        @else if (file) { <p class="field-hint">{{ file.name + ' · ' + formatFileSize(file.size) }}</p> }
      </label>
      <label class="file-input-label">替换封面（可选）
        <input type="file" accept="image/png,image/jpeg,image/webp" (change)="onCoverChange($event)">
        @if (cover) { <p class="field-hint">{{ cover.name }}</p> }
      </label>
      <label class="text-input-label">
        标题
        <input name="title" [(ngModel)]="title" maxlength="120" required autocomplete="off" [attr.aria-invalid]="!title.trim() ? 'true' : 'false'">
        @if (title.trim().length > 0) {
          <span class="char-count">{{ title.trim().length }} / 120</span>
        }
      </label>
      <label>
        分类
        <select name="category" [(ngModel)]="category" required>
          <option value="arcade">动作</option><option value="adventure">冒险</option><option value="shooter">射击</option><option value="puzzle">解谜</option><option value="casual">休闲</option><option value="rpg">角色扮演</option><option value="strategy">策略</option><option value="simulation">模拟</option><option value="sandbox">沙盒</option><option value="racing">竞速</option><option value="sports">体育</option><option value="card">卡牌</option><option value="music">音乐</option><option value="horror">恐怖</option><option value="board">桌游</option><option value="other">其他</option>
        </select>
      </label>
      <label class="text-input-label">
        标签
        <input name="tags" [(ngModel)]="tags" placeholder="动作, 解谜, 像素">
        @if (tags.trim()) {
          <span class="char-count">{{ tagCount() }} 个标签</span>
        }
      </label>
      <label>简介<textarea name="description" [(ngModel)]="description" rows="4" maxlength="5000" placeholder="一句话介绍你的游戏特色"></textarea></label>
      <label>操作说明<textarea name="instructions" [(ngModel)]="instructions" rows="4" maxlength="5000" placeholder="键盘、鼠标或触屏如何操作"></textarea></label>
      @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
      @if (message()) { <p class="form-success" role="status">{{ message() }}</p> }
      <button type="submit" [disabled]="submitting() || !isValid()">{{ submittingMessage() }}</button>
    </form>
  }
</main>
